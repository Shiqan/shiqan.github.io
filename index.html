<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiqan.dev</title>
  <meta name="description" content="Shiqan — minimal personal page.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://shiqan.dev/">
  <meta property="og:url" content="https://shiqan.dev/">
  <meta property="og:title" content="Shiqan.dev">
  <meta property="og:description" content="Shiqan — minimal personal page.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111115" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 6h4l3 14c.8 3.6 4.4 4.2 5.4 1.2l1.6-4.7' fill='none' stroke='%232100EC' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cellipse cx='24.5' cy='16' rx='3' ry='1.4' transform='rotate(-22 24.5 16)' fill='none' stroke='%232100EC' stroke-width='2.2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #1f1f24;
      --muted: #63636e;
      --accent: #2100EC;
      --accent-fill: #2100EC;
      --accent-soft: rgba(33, 0, 236, 0.08);
      --gold: #D49B1A;
      --gold-ink: #8f6200;
      --gold-active: #8f6200;
      --gold-soft: rgba(212, 155, 26, 0.14);
      --key-bg: #f3f3f6;
      --key-border: #e4e4ea;
      --link-underline: rgba(31, 31, 36, 0.35);
      --signoff-underline: rgba(99, 99, 110, 0.45);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111115;
        --ink: #ececf1;
        --muted: #9898a6;
        --accent: #7b6dff;
        --accent-fill: #5a48f5;
        --accent-soft: rgba(123, 109, 255, 0.16);
        --gold: #eab338;
        --gold-ink: #f3c458;
        --gold-active: #b87e00;
        --gold-soft: rgba(234, 179, 56, 0.16);
        --key-bg: #1b1b22;
        --key-border: #2c2c36;
        --link-underline: rgba(236, 236, 241, 0.35);
        --signoff-underline: rgba(152, 152, 166, 0.45);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    ::selection {
      background: var(--accent);
      color: #ffffff;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .stage {
      width: 100%;
      max-width: 472px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Instrument block */
    .sax-wrap {
      --key-size: 28px;
      --key-gap: 16px;
      --row-width: calc(6 * var(--key-size) + 5 * var(--key-gap));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 36px;
      width: 100%;
    }

    .sax-svg {
      width: 168px;
      height: 152px;
      margin-left: calc((var(--row-width) - 168px) / 2 + 2px);
      overflow: visible;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sax-body {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 220ms ease, transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 78px 86px;
    }

    .sax-stroke {
      stroke-dasharray: 102 110;
      stroke-dashoffset: 0;
      animation: sax-draw 200ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    .sax-mouthpiece {
      animation-duration: 140ms;
      animation-delay: 0ms;
      animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .sax-neck-spine {
      animation-duration: 360ms;
      animation-delay: 80ms;
      animation-timing-function: cubic-bezier(0.32, 0, 0.65, 1);
    }

    .sax-octave {
      animation-duration: 95ms;
      animation-delay: 160ms;
      animation-timing-function: ease-out;
    }

    .sax-strap-ring {
      animation-duration: 95ms;
      animation-delay: 275ms;
      animation-timing-function: ease-out;
    }

    .sax-bow-bell {
      animation-duration: 310ms;
      animation-delay: 425ms;
      animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .sax-bell-rim {
      animation-duration: 180ms;
      animation-delay: 680ms;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sax-svg.is-playing .sax-body {
      transform: rotate(-1.4deg) scale(1.012);
    }

    .sax-svg.is-gold .sax-body {
      stroke: var(--gold);
    }

    .sax-bell-target {
      fill: transparent;
      cursor: pointer;
      touch-action: none;
    }

    .sax-key {
      cursor: pointer;
      touch-action: none;
      transition: transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
      transform-box: fill-box;
      transform-origin: center;
    }

    .sax-key-hit {
      fill: transparent;
      pointer-events: all;
    }

    .sax-key-ring {
      fill: var(--bg);
      stroke: var(--accent);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-dasharray: 102 110;
      stroke-dashoffset: 0;
      transition: fill 110ms ease, stroke 180ms ease;
      animation: sax-key-draw 160ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    .sax-key[data-index="0"] .sax-key-ring { animation-delay: 230ms; }
    .sax-key[data-index="1"] .sax-key-ring { animation-delay: 260ms; }
    .sax-key[data-index="2"] .sax-key-ring { animation-delay: 290ms; }
    .sax-key[data-index="3"] .sax-key-ring { animation-delay: 322ms; }
    .sax-key[data-index="4"] .sax-key-ring { animation-delay: 355ms; }
    .sax-key[data-index="5"] .sax-key-ring { animation-delay: 400ms; }

    .sax-key:hover .sax-key-ring {
      fill: var(--accent-soft);
    }

    .sax-key.is-active {
      transform: scale(0.84);
    }

    .sax-key.is-active .sax-key-ring {
      fill: var(--accent);
    }

    .sax-svg.is-gold .sax-key-ring {
      stroke: var(--gold);
    }

    .sax-svg.is-gold .sax-key.is-active .sax-key-ring {
      fill: var(--gold);
    }

    /* Breath / bell sound arcs */
    .bell-wave {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: left bottom;
      pointer-events: none;
    }

    .sax-svg.is-gold .bell-wave {
      stroke: var(--gold);
    }

    .sax-svg.is-playing .bell-wave-1 {
      animation: wave-pulse 640ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .sax-svg.is-playing .bell-wave-2 {
      animation: wave-pulse 640ms cubic-bezier(0.16, 1, 0.3, 1) 180ms infinite;
    }

    /* Keycap row */
    .keycaps {
      display: grid;
      grid-template-columns: repeat(7, var(--key-size));
      gap: var(--key-gap);
      align-items: center;
    }

    .keycap {
      position: relative;
      appearance: none;
      border: 1px solid var(--key-border);
      background: var(--key-bg);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      width: var(--key-size);
      height: var(--key-size);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 120ms cubic-bezier(0.22, 1, 0.36, 1),
        background-color 120ms ease,
        border-color 120ms ease,
        color 120ms ease,
        opacity 220ms ease;
      animation: key-intro 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .keycap::after {
      content: "";
      position: absolute;
      inset: -8px -5px;
    }

    .keycap:nth-child(1) { animation-delay: 140ms; }
    .keycap:nth-child(2) { animation-delay: 200ms; }
    .keycap:nth-child(3) { animation-delay: 260ms; }
    .keycap:nth-child(4) { animation-delay: 320ms; }
    .keycap:nth-child(5) { animation-delay: 380ms; }
    .keycap:nth-child(6) { animation-delay: 440ms; }

    .keycap:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .keycap:focus-visible,
    .sax-key:focus-visible,
    .sax-bell-target:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .keycap.is-active {
      background: var(--accent-fill);
      border-color: var(--accent-fill);
      color: #ffffff;
      transform: scale(0.92) translateY(1px);
    }

    /* Hidden Easter egg keycap (U) */
    .keycap--egg {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      animation: none;
    }

    .keycap--egg.is-revealed {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      border-color: rgba(212, 155, 26, 0.55);
      background: var(--gold-soft);
      color: var(--gold-ink);
    }

    .keycap--egg.is-revealed:hover {
      border-color: var(--gold);
      color: var(--gold-ink);
    }

    .keycap--egg.is-revealed.is-active {
      background: var(--gold-active);
      border-color: var(--gold-active);
      color: #ffffff;
      transform: scale(0.92) translateY(1px);
    }

    /* Bio copy */
    .bio {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.72;
      color: var(--ink);
      letter-spacing: -0.005em;
      animation: fade-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
    }

    .bio a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--link-underline);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: color 140ms ease, text-decoration-color 140ms ease;
    }

    .bio a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .signoff {
      margin: 22px 0 0;
      font-size: 14px;
      color: var(--muted);
      animation: fade-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 320ms both;
    }

    .signoff a {
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: color 140ms ease;
    }

    .signoff a span {
      text-decoration: underline;
      text-decoration-color: var(--signoff-underline);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: text-decoration-color 140ms ease;
    }

    .signoff a:hover {
      color: var(--accent);
    }

    .signoff a:hover span {
      text-decoration-color: var(--accent);
    }

    .signoff-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    @keyframes sax-draw {
      0% {
        stroke-dashoffset: 104;
        opacity: 0;
      }
      1% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes sax-key-draw {
      0% {
        stroke-dashoffset: 104;
        fill-opacity: 0;
        opacity: 0;
      }
      2% {
        opacity: 1;
      }
      45% {
        fill-opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        opacity: 1;
      }
    }

    @keyframes fade-rise {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes key-intro {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes wave-pulse {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.75);
      }
      25% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate(8px, -8px) scale(1.22);
      }
    }

    @media (pointer: coarse) {
      .sax-wrap {
        --key-size: 32px;
        --key-gap: 12px;
      }
    }

    @media (max-width: 440px) {
      .sax-wrap {
        --key-gap: 10px;
      }
    }

    @media (max-width: 360px) {
      .sax-wrap {
        --key-size: 30px;
        --key-gap: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="stage" aria-labelledby="pageTitle">
      <h1 class="sr-only" id="pageTitle">Shiqan</h1>
      <div class="sax-wrap">
        <svg class="sax-svg" id="saxSvg" viewBox="0 0 176 156" role="img" aria-label="Interactive saxophone">
          <!-- Neck, mouthpiece, single-line body tube, bow, and flared bell -->
          <g class="sax-body">
            <!-- Mouthpiece -->
            <path class="sax-stroke sax-mouthpiece" pathLength="100" d="M 20 22 L 34 18 L 37 23 L 22 27 Z" />
            <!-- Curved neck & body spine -->
            <path class="sax-stroke sax-neck-spine" pathLength="100" d="M 36 20 C 52 16, 62 22, 66 36 L 82 114" />
            <!-- Octave key lever -->
            <path class="sax-stroke sax-octave" pathLength="100" d="M 52 20 L 58 29" />
            <!-- Lower bow & ascending bell -->
            <path class="sax-stroke sax-bow-bell" pathLength="100" d="M 82 114 C 86 138, 114 142, 122 118 L 136 68" />
            <!-- Bell rim -->
            <ellipse class="sax-stroke sax-bell-rim" pathLength="100" cx="139" cy="64" rx="13" ry="5.5" transform="rotate(-18 139 64)" />
            <!-- Neck strap ring -->
            <circle class="sax-stroke sax-strap-ring" pathLength="100" cx="67" cy="66" r="2.2" />
          </g>

          <!-- Generous click target over the bell for the Easter egg -->
          <circle class="sax-bell-target" id="bellTrigger" cx="139" cy="64" r="20" role="button" tabindex="0" aria-label="Play saxophone riff" />

          <!-- Subtle sound arcs from bell -->
          <path class="bell-wave bell-wave-1" d="M 152 52 C 157 49, 161 52, 161 57" />
          <path class="bell-wave bell-wave-2" d="M 158 44 C 165 40, 171 45, 171 53" />

          <!-- 6 interactive pearl keys along the sax spine (mapped to Q-Y) -->
          <g class="sax-key" data-index="0" role="button" tabindex="0" aria-pressed="false" aria-label="Play D4 (Q)">
            <ellipse class="sax-key-hit" cx="68" cy="46" rx="16" ry="8.5" />
            <circle class="sax-key-ring" pathLength="100" cx="68" cy="46" r="5.2" />
          </g>
          <g class="sax-key" data-index="1" role="button" tabindex="0" aria-pressed="false" aria-label="Play F4 (W)">
            <ellipse class="sax-key-hit" cx="71" cy="59" rx="16" ry="8.5" />
            <circle class="sax-key-ring" pathLength="100" cx="71" cy="59" r="5.2" />
          </g>
          <g class="sax-key" data-index="2" role="button" tabindex="0" aria-pressed="false" aria-label="Play G4 (E)">
            <ellipse class="sax-key-hit" cx="74" cy="72" rx="16" ry="8.5" />
            <circle class="sax-key-ring" pathLength="100" cx="74" cy="72" r="5.2" />
          </g>
          <g class="sax-key" data-index="3" role="button" tabindex="0" aria-pressed="false" aria-label="Play A-flat 4 (R)">
            <ellipse class="sax-key-hit" cx="77" cy="85" rx="16" ry="8.5" />
            <circle class="sax-key-ring" pathLength="100" cx="77" cy="85" r="5.2" />
          </g>
          <g class="sax-key" data-index="4" role="button" tabindex="0" aria-pressed="false" aria-label="Play A4 (T)">
            <ellipse class="sax-key-hit" cx="80" cy="98" rx="16" ry="8.5" />
            <circle class="sax-key-ring" pathLength="100" cx="80" cy="98" r="5.2" />
          </g>
          <g class="sax-key" data-index="5" role="button" tabindex="0" aria-pressed="false" aria-label="Play C5 (Y)">
            <ellipse class="sax-key-hit" cx="83" cy="111" rx="16" ry="8.5" />
            <circle class="sax-key-ring" pathLength="100" cx="83" cy="111" r="5.2" />
          </g>
        </svg>

        <!-- Keycaps mapped to Q W E R T Y + hidden U Easter egg -->
        <div class="keycaps" role="group" aria-label="Saxophone keyboard controls">
          <button class="keycap" type="button" data-index="0" data-key="q" aria-pressed="false" aria-label="Note D4, key Q">Q</button>
          <button class="keycap" type="button" data-index="1" data-key="w" aria-pressed="false" aria-label="Note F4, key W">W</button>
          <button class="keycap" type="button" data-index="2" data-key="e" aria-pressed="false" aria-label="Note G4, key E">E</button>
          <button class="keycap" type="button" data-index="3" data-key="r" aria-pressed="false" aria-label="Note A-flat 4, key R">R</button>
          <button class="keycap" type="button" data-index="4" data-key="t" aria-pressed="false" aria-label="Note A4, key T">T</button>
          <button class="keycap" type="button" data-index="5" data-key="y" aria-pressed="false" aria-label="Note C5, key Y">Y</button>
          <button class="keycap keycap--egg" type="button" id="eggKey" data-key="u" aria-label="Play riff, key U" aria-hidden="true" tabindex="-1">U</button>
        </div>
      </div>

      <p class="bio">Still figuring it out. Probably always will be.</p>

      <p class="signoff"><a href="https://github.com/shiqan/" target="_blank" rel="noopener noreferrer"><svg class="signoff-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg><span>Shiqan</span></a></p>
    </section>
  </main>

  <script>
    (() => {
      // D minor blues scale (C-concert pitch)
      const NOTES = [
        { key: 'q', name: 'D4', freq: 293.66 },
        { key: 'w', name: 'F4', freq: 349.23 },
        { key: 'e', name: 'G4', freq: 392.00 },
        { key: 'r', name: 'Ab4', freq: 415.30 },
        { key: 't', name: 'A4', freq: 440.00 },
        { key: 'y', name: 'C5', freq: 523.25 }
      ];

      // D minor blues lick for the U / bell Easter egg (mapped directly to NOTES)
      const LICK = [
        { index: 0, delay: 0.00, dur: 0.14 },
        { index: 1, delay: 0.15, dur: 0.14 },
        { index: 4, delay: 0.30, dur: 0.14 },
        { index: 5, delay: 0.45, dur: 0.24 },
        { index: 4, delay: 0.72, dur: 0.14 },
        { index: 3, delay: 0.87, dur: 0.14 },
        { index: 2, delay: 1.02, dur: 0.14 },
        { index: 1, delay: 1.17, dur: 0.14 },
        { index: 0, delay: 1.33, dur: 0.42 }
      ];

      const saxSvg = document.getElementById('saxSvg');
      const bellTrigger = document.getElementById('bellTrigger');
      const eggKey = document.getElementById('eggKey');
      const keyButtons = Array.from(document.querySelectorAll('.keycap[data-index]'));
      const svgKeys = Array.from(document.querySelectorAll('.sax-key[data-index]'));

      let audioCtx = null;
      let masterInput = null;
      let noiseBuffer = null;
      const activeVoices = new Map();
      const activePointers = new Map();
      const activeLickVoices = new Set();
      const activeLickCounts = new Array(NOTES.length).fill(0);
      let lickTimers = [];
      let lickGeneration = 0;

      function createRoomImpulse(ctx, durationSec = 0.45) {
        const length = Math.floor(ctx.sampleRate * durationSec);
        const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          for (let i = 0; i < length; i++) {
            const decay = Math.pow(1 - i / length, 2.6);
            data[i] = (Math.random() * 2 - 1) * decay;
          }
        }
        return impulse;
      }

      function getAudioContext() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();

          // Shared limiter bus prevents chord clipping when holding multiple keys
          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-10, audioCtx.currentTime);
          compressor.knee.setValueAtTime(18, audioCtx.currentTime);
          compressor.ratio.setValueAtTime(4, audioCtx.currentTime);
          compressor.attack.setValueAtTime(0.004, audioCtx.currentTime);
          compressor.release.setValueAtTime(0.12, audioCtx.currentTime);

          const masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(0.9, audioCtx.currentTime);

          // Subtle shared room resonance
          const convolver = audioCtx.createConvolver();
          convolver.buffer = createRoomImpulse(audioCtx);

          const wetFilter = audioCtx.createBiquadFilter();
          wetFilter.type = 'lowpass';
          wetFilter.frequency.setValueAtTime(2200, audioCtx.currentTime);

          const wetGain = audioCtx.createGain();
          wetGain.gain.setValueAtTime(0.16, audioCtx.currentTime);

          masterGain.connect(compressor);
          masterGain.connect(convolver);
          convolver.connect(wetFilter);
          wetFilter.connect(wetGain);
          wetGain.connect(compressor);

          compressor.connect(audioCtx.destination);
          masterInput = masterGain;
        }
        return { ctx: audioCtx, output: masterInput };
      }

      function getBreathBuffer(ctx) {
        if (noiseBuffer) return noiseBuffer;
        const length = Math.floor(ctx.sampleRate * 0.5);
        noiseBuffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return noiseBuffer;
      }

      function holdAndFadeGain(gainParam, t, fadeSec) {
        if (typeof gainParam.cancelAndHoldAtTime === 'function') {
          gainParam.cancelAndHoldAtTime(t);
        } else {
          gainParam.cancelScheduledValues(t);
          gainParam.setValueAtTime(Math.max(gainParam.value, 0.0001), t);
        }
        gainParam.exponentialRampToValueAtTime(0.0001, t + fadeSec);
      }

      // Warm reedy saxophone synth voice (sustained until stop(), or sample-accurate fixed duration)
      function createSaxVoice(freq, peakGain = 0.22, startOffset = 0, duration = null) {
        const { ctx, output } = getAudioContext();
        const startAt = ctx.currentTime + Math.max(0, startOffset);
        const scoopEnd = duration === null ? 0.028 : Math.min(0.028, duration * 0.25);

        const saw = ctx.createOscillator();
        saw.type = 'sawtooth';
        saw.frequency.setValueAtTime(freq * 0.988, startAt);
        saw.frequency.exponentialRampToValueAtTime(freq, startAt + scoopEnd);

        const tri = ctx.createOscillator();
        tri.type = 'triangle';
        tri.frequency.setValueAtTime(freq * 0.988, startAt);
        tri.frequency.exponentialRampToValueAtTime(freq, startAt + scoopEnd);
        tri.detune.setValueAtTime(-4, startAt);

        const sawGain = ctx.createGain();
        sawGain.gain.setValueAtTime(0.65, startAt);

        const triGain = ctx.createGain();
        triGain.gain.setValueAtTime(0.45, startAt);

        // Formant-like lowpass filter with slight reed bite on attack
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.Q.setValueAtTime(2.4, startAt);
        filter.frequency.setValueAtTime(Math.min(freq * 6, 2400), startAt);
        filter.frequency.exponentialRampToValueAtTime(Math.min(freq * 3.1, 1350), startAt + 0.14);

        // Subtle breath chiff on attack
        const breath = ctx.createBufferSource();
        breath.buffer = getBreathBuffer(ctx);
        breath.loop = true;

        const breathFilter = ctx.createBiquadFilter();
        breathFilter.type = 'bandpass';
        breathFilter.frequency.setValueAtTime(1600, startAt);
        breathFilter.Q.setValueAtTime(1.5, startAt);

        const breathGain = ctx.createGain();
        breathGain.gain.setValueAtTime(0.035, startAt);
        breathGain.gain.exponentialRampToValueAtTime(0.004, startAt + 0.12);

        // Gentle delayed vibrato
        const vibrato = ctx.createOscillator();
        vibrato.type = 'sine';
        vibrato.frequency.setValueAtTime(5.3, startAt);

        const vibratoDepth = ctx.createGain();
        vibratoDepth.gain.setValueAtTime(0.0001, startAt);
        vibratoDepth.gain.linearRampToValueAtTime(freq * 0.0065, startAt + 0.35);

        vibrato.connect(vibratoDepth);
        vibratoDepth.connect(saw.frequency);
        vibratoDepth.connect(tri.frequency);

        // Amplitude envelope
        const env = ctx.createGain();
        const attackEnd = duration === null ? 0.03 : Math.min(0.03, duration * 0.25);
        const decayEnd = duration === null ? 0.11 : Math.min(0.11, duration * 0.7);
        env.gain.setValueAtTime(0.0001, startAt);
        env.gain.linearRampToValueAtTime(peakGain, startAt + attackEnd);
        env.gain.linearRampToValueAtTime(peakGain * 0.78, startAt + decayEnd);

        saw.connect(sawGain);
        tri.connect(triGain);
        sawGain.connect(filter);
        triGain.connect(filter);

        breath.connect(breathFilter);
        breathFilter.connect(breathGain);
        breathGain.connect(env);

        filter.connect(env);
        env.connect(output);

        saw.start(startAt);
        tri.start(startAt);
        breath.start(startAt);
        vibrato.start(startAt);

        function stopSources(when) {
          saw.stop(when);
          tri.stop(when);
          breath.stop(when);
          vibrato.stop(when);
        }

        let sourcesStopped = false;
        let scheduledEndAt = null;
        if (duration !== null) {
          const releaseAt = startAt + duration;
          scheduledEndAt = releaseAt + 0.16;
          env.gain.setValueAtTime(peakGain * 0.78, releaseAt);
          env.gain.exponentialRampToValueAtTime(0.0001, releaseAt + 0.14);
          stopSources(scheduledEndAt);
          sourcesStopped = true;
        }

        let stopped = false;
        return {
          stop() {
            if (stopped) return;
            stopped = true;
            const t = ctx.currentTime;
            if (scheduledEndAt !== null && t >= scheduledEndAt) return;

            if (t < startAt) {
              env.gain.cancelScheduledValues(0);
              env.gain.setValueAtTime(0.0001, t);
              if (!sourcesStopped) {
                sourcesStopped = true;
                stopSources(startAt + 0.02);
              }
              return;
            }

            if (sourcesStopped) {
              // Fixed-duration sources already have .stop() scheduled; fade out immediately without re-calling .stop()
              holdAndFadeGain(env.gain, t, 0.05);
              return;
            }

            sourcesStopped = true;
            holdAndFadeGain(env.gain, t, 0.14);
            stopSources(t + 0.16);
          }
        };
      }

      function updatePlayingVisuals() {
        const hasActive = activeVoices.size > 0;
        saxSvg.classList.toggle('is-playing', hasActive || saxSvg.classList.contains('is-gold'));
      }

      function syncKeyVisual(index) {
        const manualActive = Array.from(activeVoices.values()).some((v) => v.index === index);
        const active = manualActive || activeLickCounts[index] > 0;
        const pressed = String(active);
        if (keyButtons[index]) {
          keyButtons[index].classList.toggle('is-active', active);
          keyButtons[index].setAttribute('aria-pressed', pressed);
        }
        if (svgKeys[index]) {
          svgKeys[index].classList.toggle('is-active', active);
          svgKeys[index].setAttribute('aria-pressed', pressed);
        }
      }

      function startNote(index, sourceId) {
        if (index < 0 || index >= NOTES.length) return;
        const voiceId = `${sourceId}:${index}`;
        if (activeVoices.has(voiceId)) return;

        const { ctx } = getAudioContext();
        const entry = { index, voice: null, cancelled: false };
        activeVoices.set(voiceId, entry);
        syncKeyVisual(index);
        updatePlayingVisuals();

        if (ctx.state === 'suspended') {
          ctx.resume().then(() => {
            if (entry.cancelled || activeVoices.get(voiceId) !== entry) return;
            entry.voice = createSaxVoice(NOTES[index].freq);
          }).catch(() => {
            if (activeVoices.get(voiceId) === entry) {
              activeVoices.delete(voiceId);
              syncKeyVisual(index);
              updatePlayingVisuals();
            }
          });
        } else {
          entry.voice = createSaxVoice(NOTES[index].freq);
        }
      }

      function stopNote(index, sourceId) {
        const voiceId = `${sourceId}:${index}`;
        const entry = activeVoices.get(voiceId);
        if (!entry) return;
        entry.cancelled = true;
        if (entry.voice) {
          entry.voice.stop();
        }
        activeVoices.delete(voiceId);

        syncKeyVisual(index);
        updatePlayingVisuals();
      }

      function stopLick() {
        lickGeneration += 1;
        lickTimers.forEach(clearTimeout);
        lickTimers = [];
        for (const voice of activeLickVoices) {
          voice.stop();
        }
        activeLickVoices.clear();
        activeLickCounts.fill(0);
        eggKey.classList.remove('is-active');
        saxSvg.classList.remove('is-gold');
        NOTES.forEach((_, i) => syncKeyVisual(i));
        updatePlayingVisuals();
      }

      function stopAllNotes() {
        activePointers.clear();
        for (const [voiceId, entry] of activeVoices.entries()) {
          entry.cancelled = true;
          if (entry.voice) {
            entry.voice.stop();
          }
          activeVoices.delete(voiceId);
          syncKeyVisual(entry.index);
        }
        stopLick();
      }

      function triggerEggLick() {
        stopLick();

        // Reveal hidden U keycap
        eggKey.classList.add('is-revealed', 'is-active');
        eggKey.removeAttribute('aria-hidden');
        eggKey.removeAttribute('tabindex');
        saxSvg.classList.add('is-gold', 'is-playing');

        const gen = lickGeneration;
        const { ctx } = getAudioContext();

        const scheduleLick = () => {
          if (gen !== lickGeneration) return;
          let maxEndSec = 0;

          LICK.forEach((step) => {
            const note = NOTES[step.index];
            if (!note) return;
            const voice = createSaxVoice(note.freq, 0.19, step.delay, step.dur);
            activeLickVoices.add(voice);
            maxEndSec = Math.max(maxEndSec, step.delay + step.dur + 0.16);

            const startTimer = setTimeout(() => {
              if (gen !== lickGeneration) return;
              activeLickCounts[step.index] += 1;
              syncKeyVisual(step.index);
            }, step.delay * 1000);

            const endTimer = setTimeout(() => {
              if (gen !== lickGeneration) return;
              activeLickCounts[step.index] = Math.max(0, activeLickCounts[step.index] - 1);
              syncKeyVisual(step.index);
            }, (step.delay + step.dur) * 1000);

            lickTimers.push(startTimer, endTimer);
          });

          const finishTimer = setTimeout(() => {
            if (gen !== lickGeneration) return;
            activeLickVoices.clear();
            eggKey.classList.remove('is-active');
            saxSvg.classList.remove('is-gold');
            updatePlayingVisuals();
          }, Math.max(1700, maxEndSec * 1000));
          lickTimers.push(finishTimer);
        };

        if (ctx.state === 'suspended') {
          ctx.resume().then(scheduleLick).catch(() => {});
        } else {
          scheduleLick();
        }
      }

      function getKeyIndexFromPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        const target = el && el.closest('.keycap[data-index], .sax-key[data-index]');
        return target ? Number(target.dataset.index) : -1;
      }

      function bindInteractiveKey(el, kbdSourceId) {
        const index = Number(el.dataset.index);
        el.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          e.preventDefault();
          if (el.setPointerCapture) {
            try { el.setPointerCapture(e.pointerId); } catch (_) {}
          }
          const sourceId = `ptr-${e.pointerId}`;
          activePointers.set(e.pointerId, { index, sourceId });
          startNote(index, sourceId);
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (!e.repeat) startNote(index, kbdSourceId);
          }
        });
        el.addEventListener('keyup', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            stopNote(index, kbdSourceId);
          }
        });
        el.addEventListener('blur', () => {
          stopNote(index, kbdSourceId);
        });
      }

      keyButtons.forEach((btn) => bindInteractiveKey(btn, 'cap-kbd'));
      svgKeys.forEach((keyEl) => bindInteractiveKey(keyEl, 'svg-kbd'));

      // Slide-to-play glissando and reliable pointer release across gaps
      window.addEventListener('pointermove', (e) => {
        const state = activePointers.get(e.pointerId);
        if (!state) return;
        const nextIndex = getKeyIndexFromPoint(e.clientX, e.clientY);
        if (nextIndex !== -1 && nextIndex !== state.index) {
          stopNote(state.index, state.sourceId);
          state.index = nextIndex;
          startNote(nextIndex, state.sourceId);
        }
      });

      function releasePointer(e) {
        const state = activePointers.get(e.pointerId);
        if (!state) return;
        stopNote(state.index, state.sourceId);
        activePointers.delete(e.pointerId);
      }

      window.addEventListener('pointerup', releasePointer);
      window.addEventListener('pointercancel', releasePointer);

      eggKey.addEventListener('click', triggerEggLick);
      bellTrigger.addEventListener('click', triggerEggLick);
      bellTrigger.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (!e.repeat) triggerEggLick();
        }
      });

      // Keyboard shortcuts (Q-Y + U Easter egg)
      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        const pressed = e.key.toLowerCase();
        if (pressed === 'u') {
          triggerEggLick();
          return;
        }
        const idx = NOTES.findIndex((n) => n.key === pressed);
        if (idx !== -1) {
          startNote(idx, 'kbd');
        }
      });

      window.addEventListener('keyup', (e) => {
        const released = e.key.toLowerCase();
        const idx = NOTES.findIndex((n) => n.key === released);
        if (idx !== -1) {
          stopNote(idx, 'kbd');
        }
      });

      window.addEventListener('blur', stopAllNotes);
      window.addEventListener('pagehide', stopAllNotes);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopAllNotes();
      });
    })();
  </script>
</body>

</html>
