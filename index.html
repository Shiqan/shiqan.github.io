<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiqan.dev</title>
  <meta name="description" content="Shiqan — minimal personal page.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://shiqan.dev/">
  <meta property="og:url" content="https://shiqan.dev/">
  <meta property="og:title" content="Shiqan.dev">
  <meta property="og:description" content="Shiqan — minimal personal page.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 6h4l3 14c.8 3.6 4.4 4.2 5.4 1.2l1.6-4.7' fill='none' stroke='%232100EC' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cellipse cx='24.5' cy='16' rx='3' ry='1.4' transform='rotate(-22 24.5 16)' fill='none' stroke='%232100EC' stroke-width='2.2'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1f1f24;
      --muted: #63636e;
      --accent: #2100EC;
      --accent-soft: rgba(33, 0, 236, 0.08);
      --gold: #D49B1A;
      --gold-ink: #8f6200;
      --gold-soft: rgba(212, 155, 26, 0.14);
      --key-bg: #f3f3f6;
      --key-border: #e4e4ea;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    ::selection {
      background: var(--accent);
      color: #ffffff;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .stage {
      width: 100%;
      max-width: 472px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Instrument block */
    .sax-wrap {
      --key-size: 28px;
      --key-gap: 16px;
      --row-width: calc(6 * var(--key-size) + 5 * var(--key-gap));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 36px;
      width: 100%;
    }

    .sax-svg {
      width: 168px;
      height: 152px;
      margin-left: calc((var(--row-width) - 168px) / 2 + 2px);
      overflow: visible;
      display: block;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sax-body {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 220ms ease, transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 78px 86px;
    }

    .sax-stroke {
      stroke-dasharray: 102 110;
      stroke-dashoffset: 0;
      animation: sax-draw 200ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    .sax-mouthpiece {
      animation-duration: 140ms;
      animation-delay: 0ms;
      animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .sax-neck-spine {
      animation-duration: 360ms;
      animation-delay: 80ms;
      animation-timing-function: cubic-bezier(0.32, 0, 0.65, 1);
    }

    .sax-octave {
      animation-duration: 95ms;
      animation-delay: 160ms;
      animation-timing-function: ease-out;
    }

    .sax-strap-ring {
      animation-duration: 95ms;
      animation-delay: 275ms;
      animation-timing-function: ease-out;
    }

    .sax-bow-bell {
      animation-duration: 310ms;
      animation-delay: 425ms;
      animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .sax-bell-rim {
      animation-duration: 180ms;
      animation-delay: 680ms;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sax-svg.is-playing .sax-body {
      transform: rotate(-1.4deg) scale(1.012);
    }

    .sax-svg.is-gold .sax-body {
      stroke: var(--gold);
    }

    .sax-bell-target {
      fill: transparent;
      cursor: pointer;
    }

    .sax-key {
      cursor: pointer;
      transition: transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
      transform-box: fill-box;
      transform-origin: center;
    }

    .sax-key-ring {
      fill: var(--bg);
      stroke: var(--accent);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-dasharray: 102 110;
      stroke-dashoffset: 0;
      transition: fill 110ms ease, stroke 180ms ease;
      animation: sax-key-draw 160ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    .sax-key[data-index="0"] .sax-key-ring { animation-delay: 230ms; }
    .sax-key[data-index="1"] .sax-key-ring { animation-delay: 260ms; }
    .sax-key[data-index="2"] .sax-key-ring { animation-delay: 290ms; }
    .sax-key[data-index="3"] .sax-key-ring { animation-delay: 322ms; }
    .sax-key[data-index="4"] .sax-key-ring { animation-delay: 355ms; }
    .sax-key[data-index="5"] .sax-key-ring { animation-delay: 400ms; }

    .sax-key:hover .sax-key-ring {
      fill: var(--accent-soft);
    }

    .sax-key.is-active {
      transform: scale(0.84);
    }

    .sax-key.is-active .sax-key-ring {
      fill: var(--accent);
    }

    .sax-svg.is-gold .sax-key-ring {
      stroke: var(--gold);
    }

    .sax-svg.is-gold .sax-key.is-active .sax-key-ring {
      fill: var(--gold);
    }

    /* Breath / bell sound arcs */
    .bell-wave {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: left bottom;
      pointer-events: none;
    }

    .sax-svg.is-gold .bell-wave {
      stroke: var(--gold);
    }

    .sax-svg.is-playing .bell-wave-1 {
      animation: wave-pulse 640ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .sax-svg.is-playing .bell-wave-2 {
      animation: wave-pulse 640ms cubic-bezier(0.16, 1, 0.3, 1) 180ms infinite;
    }

    /* Keycap row */
    .keycaps {
      display: grid;
      grid-template-columns: repeat(7, var(--key-size));
      gap: var(--key-gap);
      align-items: center;
    }

    .keycap {
      appearance: none;
      border: 1px solid var(--key-border);
      background: var(--key-bg);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      width: var(--key-size);
      height: var(--key-size);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 120ms cubic-bezier(0.22, 1, 0.36, 1),
        background-color 120ms ease,
        border-color 120ms ease,
        color 120ms ease,
        opacity 220ms ease;
      animation: key-intro 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .keycap:nth-child(1) { animation-delay: 140ms; }
    .keycap:nth-child(2) { animation-delay: 200ms; }
    .keycap:nth-child(3) { animation-delay: 260ms; }
    .keycap:nth-child(4) { animation-delay: 320ms; }
    .keycap:nth-child(5) { animation-delay: 380ms; }
    .keycap:nth-child(6) { animation-delay: 440ms; }

    .keycap:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .keycap:focus-visible,
    .sax-key:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .keycap.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      transform: scale(0.92) translateY(1px);
    }

    /* Hidden Easter egg keycap (U) */
    .keycap--egg {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      animation: none;
    }

    .keycap--egg.is-revealed {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      border-color: rgba(212, 155, 26, 0.55);
      background: var(--gold-soft);
      color: var(--gold-ink);
    }

    .keycap--egg.is-revealed:hover {
      border-color: var(--gold);
      color: var(--gold-ink);
    }

    .keycap--egg.is-revealed.is-active {
      background: var(--gold-ink);
      border-color: var(--gold-ink);
      color: #ffffff;
      transform: scale(0.92) translateY(1px);
    }

    /* Bio copy */
    .bio {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.72;
      color: var(--ink);
      letter-spacing: -0.005em;
      animation: fade-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
    }

    .bio a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: rgba(31, 31, 36, 0.35);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: color 140ms ease, text-decoration-color 140ms ease;
    }

    .bio a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .signoff {
      margin: 22px 0 0;
      font-size: 14px;
      color: var(--muted);
      animation: fade-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 320ms both;
    }

    .signoff a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: rgba(99, 99, 110, 0.45);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: color 140ms ease, text-decoration-color 140ms ease;
    }

    .signoff a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    @keyframes sax-draw {
      0% {
        stroke-dashoffset: 104;
        opacity: 0;
      }
      1% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes sax-key-draw {
      0% {
        stroke-dashoffset: 104;
        fill-opacity: 0;
        opacity: 0;
      }
      2% {
        opacity: 1;
      }
      45% {
        fill-opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        opacity: 1;
      }
    }

    @keyframes fade-rise {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes key-intro {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes wave-pulse {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.75);
      }
      25% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate(8px, -8px) scale(1.22);
      }
    }

    @media (max-width: 440px) {
      .sax-wrap {
        --key-gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="stage" aria-label="Shiqan personal page">
      <div class="sax-wrap">
        <svg class="sax-svg" id="saxSvg" viewBox="0 0 176 156" role="img" aria-label="Interactive saxophone keys">
          <!-- Neck, mouthpiece, single-line body tube, bow, and flared bell -->
          <g class="sax-body">
            <!-- Mouthpiece -->
            <path class="sax-stroke sax-mouthpiece" pathLength="100" d="M 20 22 L 34 18 L 37 23 L 22 27 Z" />
            <!-- Curved neck & body spine -->
            <path class="sax-stroke sax-neck-spine" pathLength="100" d="M 36 20 C 52 16, 62 22, 66 36 L 82 114" />
            <!-- Octave key lever -->
            <path class="sax-stroke sax-octave" pathLength="100" d="M 52 20 L 58 29" />
            <!-- Lower bow & ascending bell -->
            <path class="sax-stroke sax-bow-bell" pathLength="100" d="M 82 114 C 86 138, 114 142, 122 118 L 136 68" />
            <!-- Bell rim -->
            <ellipse class="sax-stroke sax-bell-rim" pathLength="100" cx="139" cy="64" rx="13" ry="5.5" transform="rotate(-18 139 64)" />
            <!-- Neck strap ring -->
            <circle class="sax-stroke sax-strap-ring" pathLength="100" cx="67" cy="66" r="2.2" />
          </g>

          <!-- Generous click target over the bell for the Easter egg -->
          <circle class="sax-bell-target" id="bellTrigger" cx="139" cy="64" r="20" />

          <!-- Subtle sound arcs from bell -->
          <path class="bell-wave bell-wave-1" d="M 152 52 C 157 49, 161 52, 161 57" />
          <path class="bell-wave bell-wave-2" d="M 158 44 C 165 40, 171 45, 171 53" />

          <!-- 6 interactive pearl keys along the sax spine (mapped to Q-Y) -->
          <g class="sax-key" data-index="0" role="button" tabindex="0" aria-label="Play D4 (Q)">
            <circle class="sax-key-ring" pathLength="100" cx="68" cy="46" r="5.2" />
          </g>
          <g class="sax-key" data-index="1" role="button" tabindex="0" aria-label="Play F4 (W)">
            <circle class="sax-key-ring" pathLength="100" cx="71" cy="59" r="5.2" />
          </g>
          <g class="sax-key" data-index="2" role="button" tabindex="0" aria-label="Play G4 (E)">
            <circle class="sax-key-ring" pathLength="100" cx="74" cy="72" r="5.2" />
          </g>
          <g class="sax-key" data-index="3" role="button" tabindex="0" aria-label="Play A-flat 4 (R)">
            <circle class="sax-key-ring" pathLength="100" cx="77" cy="85" r="5.2" />
          </g>
          <g class="sax-key" data-index="4" role="button" tabindex="0" aria-label="Play A4 (T)">
            <circle class="sax-key-ring" pathLength="100" cx="80" cy="98" r="5.2" />
          </g>
          <g class="sax-key" data-index="5" role="button" tabindex="0" aria-label="Play C5 (Y)">
            <circle class="sax-key-ring" pathLength="100" cx="83" cy="111" r="5.2" />
          </g>
        </svg>

        <!-- Keycaps mapped to Q W E R T Y + hidden U Easter egg -->
        <div class="keycaps" role="group" aria-label="Saxophone keyboard controls">
          <button class="keycap" type="button" data-index="0" data-key="q" aria-label="Note D4, key Q">Q</button>
          <button class="keycap" type="button" data-index="1" data-key="w" aria-label="Note F4, key W">W</button>
          <button class="keycap" type="button" data-index="2" data-key="e" aria-label="Note G4, key E">E</button>
          <button class="keycap" type="button" data-index="3" data-key="r" aria-label="Note A-flat 4, key R">R</button>
          <button class="keycap" type="button" data-index="4" data-key="t" aria-label="Note A4, key T">T</button>
          <button class="keycap" type="button" data-index="5" data-key="y" aria-label="Note C5, key Y">Y</button>
          <button class="keycap keycap--egg" type="button" id="eggKey" data-key="u" aria-label="Play riff, key U" tabindex="-1">U</button>
        </div>
      </div>

      <p class="bio">Still figuring it out. Probably always will be.</p>

      <p class="signoff">— <a href="https://github.com/shiqan/" target="_blank" rel="noopener noreferrer">Shiqan</a></p>
    </section>
  </main>

  <script>
    (() => {
      // D minor blues scale (C-concert pitch)
      const NOTES = [
        { key: 'q', name: 'D4', freq: 293.66 },
        { key: 'w', name: 'F4', freq: 349.23 },
        { key: 'e', name: 'G4', freq: 392.00 },
        { key: 'r', name: 'Ab4', freq: 415.30 },
        { key: 't', name: 'A4', freq: 440.00 },
        { key: 'y', name: 'C5', freq: 523.25 }
      ];

      // "The Lick" phrase for the U / bell Easter egg
      const LICK = [
        { freq: 293.66, index: 0, delay: 0, dur: 0.16 },
        { freq: 329.63, index: 1, delay: 0.17, dur: 0.16 },
        { freq: 349.23, index: 1, delay: 0.34, dur: 0.16 },
        { freq: 392.00, index: 2, delay: 0.51, dur: 0.16 },
        { freq: 329.63, index: 1, delay: 0.68, dur: 0.30 },
        { freq: 261.63, index: 0, delay: 1.00, dur: 0.17 },
        { freq: 293.66, index: 0, delay: 1.18, dur: 0.44 }
      ];

      const saxSvg = document.getElementById('saxSvg');
      const bellTrigger = document.getElementById('bellTrigger');
      const eggKey = document.getElementById('eggKey');
      const keyButtons = Array.from(document.querySelectorAll('.keycap[data-index]'));
      const svgKeys = Array.from(document.querySelectorAll('.sax-key[data-index]'));

      let audioCtx = null;
      let noiseBuffer = null;
      const activeVoices = new Map();
      let lickTimers = [];

      function getAudioContext() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function getBreathBuffer(ctx) {
        if (noiseBuffer) return noiseBuffer;
        const length = Math.floor(ctx.sampleRate * 0.5);
        noiseBuffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return noiseBuffer;
      }

      // Warm reedy saxophone synth voice (sustains until stop() is called)
      function createSaxVoice(freq, peakGain = 0.22) {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const saw = ctx.createOscillator();
        saw.type = 'sawtooth';
        saw.frequency.setValueAtTime(freq, now);

        const tri = ctx.createOscillator();
        tri.type = 'triangle';
        tri.frequency.setValueAtTime(freq, now);
        tri.detune.setValueAtTime(-4, now);

        const sawGain = ctx.createGain();
        sawGain.gain.setValueAtTime(0.65, now);

        const triGain = ctx.createGain();
        triGain.gain.setValueAtTime(0.45, now);

        // Formant-like lowpass filter with slight reed bite on attack
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.Q.setValueAtTime(2.4, now);
        filter.frequency.setValueAtTime(Math.min(freq * 6, 2400), now);
        filter.frequency.exponentialRampToValueAtTime(Math.min(freq * 3.1, 1350), now + 0.14);

        // Subtle breath chiff on attack
        const breath = ctx.createBufferSource();
        breath.buffer = getBreathBuffer(ctx);
        breath.loop = true;

        const breathFilter = ctx.createBiquadFilter();
        breathFilter.type = 'bandpass';
        breathFilter.frequency.setValueAtTime(1600, now);
        breathFilter.Q.setValueAtTime(1.5, now);

        const breathGain = ctx.createGain();
        breathGain.gain.setValueAtTime(0.035, now);
        breathGain.gain.exponentialRampToValueAtTime(0.004, now + 0.12);

        // Gentle delayed vibrato
        const vibrato = ctx.createOscillator();
        vibrato.type = 'sine';
        vibrato.frequency.setValueAtTime(5.3, now);

        const vibratoDepth = ctx.createGain();
        vibratoDepth.gain.setValueAtTime(0.0001, now);
        vibratoDepth.gain.linearRampToValueAtTime(freq * 0.0065, now + 0.35);

        vibrato.connect(vibratoDepth);
        vibratoDepth.connect(saw.frequency);
        vibratoDepth.connect(tri.frequency);

        // Master amplitude envelope
        const env = ctx.createGain();
        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(peakGain, now + 0.03);
        env.gain.linearRampToValueAtTime(peakGain * 0.78, now + 0.11);

        saw.connect(sawGain);
        tri.connect(triGain);
        sawGain.connect(filter);
        triGain.connect(filter);

        breath.connect(breathFilter);
        breathFilter.connect(breathGain);
        breathGain.connect(env);

        filter.connect(env);
        env.connect(ctx.destination);

        saw.start(now);
        tri.start(now);
        breath.start(now);
        vibrato.start(now);

        let stopped = false;
        return {
          stop() {
            if (stopped) return;
            stopped = true;
            const t = ctx.currentTime;
            env.gain.cancelScheduledValues(t);
            env.gain.setValueAtTime(Math.max(env.gain.value, 0.0001), t);
            env.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            const endAt = t + 0.16;
            saw.stop(endAt);
            tri.stop(endAt);
            breath.stop(endAt);
            vibrato.stop(endAt);
          }
        };
      }

      function updatePlayingVisuals() {
        const hasActive = activeVoices.size > 0;
        saxSvg.classList.toggle('is-playing', hasActive || saxSvg.classList.contains('is-gold'));
      }

      function setKeyVisual(index, active) {
        if (keyButtons[index]) {
          keyButtons[index].classList.toggle('is-active', active);
        }
        if (svgKeys[index]) {
          svgKeys[index].classList.toggle('is-active', active);
        }
      }

      function startNote(index, sourceId) {
        if (index < 0 || index >= NOTES.length) return;
        const voiceId = `${sourceId}:${index}`;
        if (activeVoices.has(voiceId)) return;

        const voice = createSaxVoice(NOTES[index].freq);
        activeVoices.set(voiceId, { index, voice });
        setKeyVisual(index, true);
        updatePlayingVisuals();
      }

      function stopNote(index, sourceId) {
        const voiceId = `${sourceId}:${index}`;
        const entry = activeVoices.get(voiceId);
        if (!entry) return;
        entry.voice.stop();
        activeVoices.delete(voiceId);

        const stillActiveOnIndex = Array.from(activeVoices.values()).some((v) => v.index === index);
        if (!stillActiveOnIndex) {
          setKeyVisual(index, false);
        }
        updatePlayingVisuals();
      }

      function stopAllNotes() {
        for (const [voiceId, entry] of activeVoices.entries()) {
          entry.voice.stop();
          activeVoices.delete(voiceId);
          setKeyVisual(entry.index, false);
        }
        updatePlayingVisuals();
      }

      function triggerEggLick() {
        // Reveal hidden U keycap
        eggKey.classList.add('is-revealed', 'is-active');
        eggKey.removeAttribute('tabindex');
        saxSvg.classList.add('is-gold', 'is-playing');

        // Clear any previous scheduled lick timers
        lickTimers.forEach(clearTimeout);
        lickTimers = [];

        LICK.forEach((step) => {
          const startTimer = setTimeout(() => {
            const voice = createSaxVoice(step.freq, 0.19);
            setKeyVisual(step.index, true);
            const endTimer = setTimeout(() => {
              voice.stop();
              setKeyVisual(step.index, false);
            }, step.dur * 1000);
            lickTimers.push(endTimer);
          }, step.delay * 1000);
          lickTimers.push(startTimer);
        });

        const totalMs = 1700;
        const finishTimer = setTimeout(() => {
          eggKey.classList.remove('is-active');
          saxSvg.classList.remove('is-gold');
          updatePlayingVisuals();
        }, totalMs);
        lickTimers.push(finishTimer);
      }

      // Bind pointer interactions for both keycaps and SVG pearl keys
      function bindKeyTarget(el, index, sourcePrefix) {
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          startNote(index, sourcePrefix);
        });
        const release = () => stopNote(index, sourcePrefix);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointerleave', release);
        el.addEventListener('pointercancel', release);
      }

      keyButtons.forEach((btn) => {
        const index = Number(btn.dataset.index);
        bindKeyTarget(btn, index, 'cap');
        btn.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (!e.repeat) startNote(index, 'cap-kbd');
          }
        });
        btn.addEventListener('keyup', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            stopNote(index, 'cap-kbd');
          }
        });
      });

      svgKeys.forEach((keyEl) => {
        const index = Number(keyEl.dataset.index);
        bindKeyTarget(keyEl, index, 'svg');
        keyEl.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (!e.repeat) startNote(index, 'svg-kbd');
          }
        });
        keyEl.addEventListener('keyup', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            stopNote(index, 'svg-kbd');
          }
        });
      });

      eggKey.addEventListener('click', triggerEggLick);
      bellTrigger.addEventListener('click', triggerEggLick);

      // Keyboard shortcuts (Q-Y + U Easter egg)
      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        const pressed = e.key.toLowerCase();
        if (pressed === 'u') {
          triggerEggLick();
          return;
        }
        const idx = NOTES.findIndex((n) => n.key === pressed);
        if (idx !== -1) {
          startNote(idx, 'kbd');
        }
      });

      window.addEventListener('keyup', (e) => {
        const released = e.key.toLowerCase();
        const idx = NOTES.findIndex((n) => n.key === released);
        if (idx !== -1) {
          stopNote(idx, 'kbd');
        }
      });

      window.addEventListener('blur', stopAllNotes);
    })();
  </script>
</body>

</html>
